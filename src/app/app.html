<div class="container">
  <div class="row my-3">
    <div class="col">
      <select [(ngModel)]="opcao" (ngModelChange)="reordenarLista()" name="ordem" id="ordem" class="form-select">
        <option value="0">Selecione uma opção</option>
        <option value="1">Nome</option>
        <option value="2">Fornecedor</option>
        <option value="3">Estoque</option>
        <option value="4">Preço</option>
      </select>
    </div>
  </div>
  <table class="table table-striped">
    <thead>
      <th>Nome</th>
      <th>Fornecedor</th>
      <th>Estoque</th>
      <th>Preço</th>
    </thead>
    <tbody>
      @for (produto of produtos; track $index) {
        <tr>
          <td>{{produto.nome}}</td>
          <td>{{produto.fornecedor}}</td>
          <td>{{produto.estoque}}</td>
          <td>{{produto.preco}}</td>
        </tr>
      }
    </tbody>
  </table>

<router-outlet />
