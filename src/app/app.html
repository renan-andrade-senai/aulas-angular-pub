<app-navbar brand="SENAI" [items]="navItems" />
<div class="container">
    <div class="row">
        <div class="col mb-2">
            <app-tabela [cols]="['Nome', 'Fornecedor', 'Estoque', 'Preço']" [rows]="produtos"/>
        </div>
    </div>
    <div class="row">
        <div class="col mb-2">
            <app-spinner color="danger"/>
        </div>
    </div>
    <div class="row">
        <div class="col mb-2">
            <app-list-group [items]="['Item 1', 'Item 2', 'Item 3']" />
        </div>
    </div>
    <div class="row">
        <div class="col">
            <app-input-group [(value)]="inputGroupValue" placeholder="Valor" [inicio]="['Valor','R$']" [fim]="[',00']" />
        </div>
    </div>
</div>

<router-outlet />
