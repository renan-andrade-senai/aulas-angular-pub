<div class="container">
    <ul>
    @for (pessoa of pessoas; track $index) {
      <li>{{pessoa.nome}} CPF: {{pessoa.cpf}}</li>
    }
  </ul>
  <ol>
    <li *ngFor="let pessoa of pessoas">
      {{pessoa.nome}}
    </li>
  </ol>
  <table class="table table-striped">
    <thead>
      <th>Nome</th>
      <th>Idade</th>
      <th>CPF</th>
    </thead>
    <tbody>
      @for (pessoa of pessoas; track $index) {
        <tr>
          <td>{{pessoa.nome}}</td>
          <td>{{pessoa.idade}}</td>
          <td>{{pessoa.cpf}}</td>
        </tr>
      }
    </tbody>
  </table>

  <input [(ngModel)]="pessoaEdicao.nome" type="text" name="" id="">


<router-outlet />
